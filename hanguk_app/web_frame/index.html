<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hanguk ilovasi</title>
  <meta name="description" content="Hanguk ilovasini brauzerda telefon ko'rinishida oching.">
  <link rel="icon" type="image/png" href="app/favicon.png">
  <script>
    // Telefon yoki kichik ekranda ramka kerak emas — ilovaning o'zini ochamiz.
    // ?frame=1 bilan har doim ramkani ko'rsatish mumkin.
    (function () {
      var forceFrame = /[?&]frame=1\b/.test(location.search);
      var small = Math.min(window.innerWidth, screen.width) < 600;
      var touchPhone = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600;
      if (!forceFrame && (small || touchPhone)) location.replace('app/' + location.hash);
    })();
  </script>
  <style>
    :root {
      --bg: #0b1730;
      --bg2: #1d3561;
      --fg: #f4f6fb;
      --muted: #a9b4cc;
      --accent: #d4f441;
      --bezel: #0a0a0c;
      --phone-w: 390px;
      --phone-h: 844px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(ellipse at 30% 20%, var(--bg2), var(--bg) 70%);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 64px;
      padding: 16px;
      overflow: hidden;
    }
    .info { max-width: 340px; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 22px; }
    .brand img { width: 44px; height: 44px; border-radius: 12px; }
    h1 { font-size: 40px; line-height: 1.1; margin: 28px 0 12px; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent); color: #0b1730; font-weight: 700;
      padding: 12px 20px; border-radius: 12px; text-decoration: none;
    }
    .btn.ghost { background: transparent; color: var(--fg); border: 1px solid #ffffff33; margin-left: 8px; }

    .stage { flex: none; width: calc(var(--phone-w) + 28px); height: calc(var(--phone-h) + 28px); }
    .phone {
      position: relative;
      width: calc(var(--phone-w) + 28px);
      height: calc(var(--phone-h) + 28px);
      padding: 14px;
      background: var(--bezel);
      border-radius: 64px;
      box-shadow: 0 0 0 2px #2a2d35, 0 40px 80px #00000080;
      transform-origin: top left;
    }
    .phone::before, .phone::after {
      /* yon tugmalar */
      content: ""; position: absolute; width: 4px; background: #2a2d35; border-radius: 2px;
    }
    .phone::before { left: -5px; top: 180px; height: 60px; }
    .phone::after { right: -5px; top: 220px; height: 90px; }
    .screen {
      position: relative; width: 100%; height: 100%;
      border-radius: 50px; overflow: hidden; background: #0b1730;
    }
    .island {
      position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 2;
      pointer-events: none;
    }
    .status {
      height: 50px; display: flex; align-items: center; justify-content: space-between;
      padding: 6px 34px 0; font-size: 15px; font-weight: 600; color: #fff; background: #0e1a33;
    }
    .status .icons { display: flex; gap: 6px; align-items: center; }
    iframe { display: block; width: 100%; height: calc(100% - 50px); border: 0; background: #fff; }

    @media (max-width: 900px) {
      .info { display: none; }
    }
  </style>
</head>
<body>
  <section class="info">
    <div class="brand"><img src="app/icons/Icon-192.png" alt="">Hanguk</div>
    <h1>Koreyaga yo'l — <span>bitta ilovada</span></h1>
    <p>Bu Hanguk mobil ilovasining veb versiyasi. Telefonda ochsangiz, to'liq ekranda ishlaydi.</p>
    <a class="btn" href="app/" target="_blank" rel="noopener">To'liq ekranda ochish →</a>
  </section>

  <div class="stage" id="stage">
    <div class="phone" id="phone">
      <div class="screen">
        <div class="island"></div>
        <div class="status">
          <span id="clock">9:41</span>
          <span class="icons" aria-hidden="true">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="26" height="12" viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="#fff"/><rect x="24" y="4" width="1.5" height="4" rx=".75" fill="#fff" opacity=".5"/></svg>
          </span>
        </div>
        <iframe src="app/" title="Hanguk ilovasi" allow="microphone; camera; geolocation; clipboard-write; autoplay"></iframe>
      </div>
    </div>
  </div>

  <script>
    // Telefon ramkasini oyna balandligiga sig'diramiz.
    (function () {
      var stage = document.getElementById('stage');
      var phone = document.getElementById('phone');
      var W = phone.offsetWidth, H = phone.offsetHeight;
      function fit() {
        var s = Math.min(1, (window.innerHeight - 32) / H, (window.innerWidth - 32) / W);
        phone.style.transform = 'scale(' + s + ')';
        stage.style.width = W * s + 'px';
        stage.style.height = H * s + 'px';
      }
      window.addEventListener('resize', fit);
      fit();

      var clock = document.getElementById('clock');
      function tick() {
        var d = new Date();
        clock.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
      }
      tick();
      setInterval(tick, 15000);
    })();
  </script>
</body>
</html>
