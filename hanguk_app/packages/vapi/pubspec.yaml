name: vapi
description: "The Vapi Flutter Client SDK with unified mobile and web support."
version: 0.1.0
homepage: https://vapi.ai/

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  
  # general dependencies
  http: ^1.2.0

  
  # Mobile-specific dependencies
  # Bumped from 0.31.0 (2026-08-03): the 0.31.0 build of libdaily-flutter.so
  # is only 4 KB-page-aligned, which Play Console rejects under the 16 KB
  # native library requirement (enforced Nov 1, 2025). 0.39.0 ships a
  # 16 KB-aligned build.
  daily_flutter: ^0.39.0
  permission_handler: ^11.3.1
  
  # Web-specific dependencies
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      web:
        pluginClass: VapiWebClient
        fileName: src/platform/web/vapi_web_client.dart
