[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uzum-market-scraper"
version = "0.1.0"
description = "Scrape products, prices, sale counts, ratings, reviews, and shops from Uzum Market (uzum.uz)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["uzum", "uzum-market", "uzbekistan", "e-commerce", "scraper", "graphql"]
authors = [{ name = "uzum-market-scraper contributors" }]
dependencies = [
    "httpx[http2]>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "PyYAML>=6.0,<7.0",
    "rich>=13.0,<15.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
uzum-scraper = "uzum_scraper.cli:main"

[project.urls]
Homepage = "https://github.com/asrbekshokirovich-bot/uzum-market-scraper"
Issues = "https://github.com/asrbekshokirovich-bot/uzum-market-scraper/issues"

[tool.setuptools.packages.find]
include = ["uzum_scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
