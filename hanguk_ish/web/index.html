<!DOCTYPE html>
<html>
<head>
  <!-- HanPyol on the web: the Telegram Mini App (2026-11-26). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HanPyol — Koreyada kunlik va oylik ish">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A1440">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HanPyol">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HanPyol</title>
  <link rel="manifest" href="manifest.json">

  <!-- window.Telegram.WebApp: who opened the app, the phone-number request. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    html, body { margin: 0; height: 100%; background: #0A1440; }
    #hp-loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #hp-loader img { width: 88px; height: 88px; border-radius: 22px; animation: hp-pulse 1.4s ease-in-out infinite; }
    @keyframes hp-pulse { 50% { opacity: .55; transform: scale(.96); } }
    @media (prefers-reduced-motion: reduce) { #hp-loader img { animation: none; } }
  </style>
</head>
<body>
  <div id="hp-loader"><img src="icons/Icon-192.png" alt="HanPyol"></div>
  <script>
    // The loader goes when Flutter draws its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('hp-loader');
      if (l) l.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
