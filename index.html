<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Meta Tags -->
    <title>Hanguk Consulting - Janubiy Koreya universitetlari</title>
    <meta name="title" content="Hanguk Consulting - Janubiy Koreya universitetlari" />
    <meta name="description" content="Janubiy Koreya universitetlariga ariza berish platformasi. O'qish uchun professional yordam va qo'llab-quvvatlash." />
    <meta name="author" content="Hanguk Consulting" />

    <!-- Fonts: Inter (UI) + JetBrains Mono (codes/data) — Hanguk Design System.
         Loaded non-render-blocking (media=print swap) so first paint isn't gated on
         Google Fonts. Only weights actually used in the app are requested. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>

    <!-- Theme Color — Royal Blue #1A3A6C -->
    <meta name="theme-color" content="#1A3A6C" />
    <meta name="msapplication-TileColor" content="#1A3A6C" />

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hanguk" />
    <link rel="apple-touch-icon" href="/icon-1024.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hanguk Consulting - Janubiy Koreya universitetlari" />
    <meta property="og:description" content="Janubiy Koreya universitetlariga ariza berish platformasi" />
    <meta property="og:image" content="/icon-1024.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hanguk Consulting" />
    <meta name="twitter:description" content="Janubiy Koreya universitetlariga ariza berish platformasi" />
    <meta name="twitter:image" content="/icon-1024.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/icon-1024.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    
    <!-- Prevent zoom on input focus (iOS) -->
    <meta name="format-detection" content="telephone=no" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function() {
        var APP_VERSION = '1.0.1_stability_refactor';
        var currentVersion = localStorage.getItem('hanguk_app_version');

        // First-ever visit: nothing is cached yet, so just record the version.
        // Skipping the unregister+reload avoids a needless double page load for
        // every new visitor (the reload path only matters for real upgrades).
        if (currentVersion === null) {
          localStorage.setItem('hanguk_app_version', APP_VERSION);
        } else if (currentVersion !== APP_VERSION) {
          console.log('Version mismatch detected! Bypassing cache lock and updating from ' + currentVersion + ' to ' + APP_VERSION);

          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for(let registration of registrations) {
                registration.unregister();
              }
            }).catch(function(err) {
              console.error('Service Worker unregistration failed: ', err);
            });
          }
          
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (let name of names) {
                caches.delete(name);
              }
            });
          }
          
          localStorage.setItem('hanguk_app_version', APP_VERSION);
          
          // Use setTimeout to ensure unregister/delete promises finish before force reload
          setTimeout(function() {
            window.location.reload(true);
          }, 300);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
