name: Flutter analyze and test

# Static analysis and the unit test suite for the student app, on Linux.
#
# ios-verify.yml proves the iOS build; nothing proved the Dart. Every change to
# hanguk_app/lib so far has been merged without being compiled — the auth
# repository retry work and its test file included — because there was no job
# that ran `flutter analyze` or `flutter test` at all.
#
# Deliberately ubuntu, not macOS: analysis and unit tests need no Xcode, and at
# a tenth of the per-minute cost this can run on every change to the app
# instead of the narrow iOS path filter.

on:
  push:
    branches: [main]
    paths:
      - 'hanguk_app/lib/**'
      - 'hanguk_app/test/**'
      - 'hanguk_app/packages/**'
      - 'hanguk_app/pubspec.yaml'
      - 'hanguk_app/pubspec.lock'
      - 'hanguk_app/analysis_options.yaml'
      - '.github/workflows/flutter-check.yml'
  pull_request:
    paths:
      - 'hanguk_app/lib/**'
      - 'hanguk_app/test/**'
      - 'hanguk_app/packages/**'
      - 'hanguk_app/pubspec.yaml'
      - 'hanguk_app/pubspec.lock'
      - 'hanguk_app/analysis_options.yaml'
      - '.github/workflows/flutter-check.yml'
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter version to build with. Blank = latest stable."
        required: false
        default: ""

concurrency:
  group: flutter-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # write: only for "Publish test screens" below (a release asset per PR).
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hanguk_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Report toolchain
        run: flutter --version

      - name: Resolve Dart dependencies
        run: flutter pub get

      # The generated AppLocalizations files are committed, so a hand-edited
      # ARB and a hand-edited .dart can drift apart silently — the app would
      # build and simply show the wrong language. Regenerate and fail if the
      # result differs from what is checked in.
      - name: Assert generated localizations match the ARB files
        run: |
          flutter gen-l10n
          if ! git diff --quiet -- lib/l10n; then
            echo "::error::lib/l10n is out of date with the .arb files."
            echo "Someone edited a generated app_localizations*.dart by hand, or added an"
            echo "ARB key without regenerating. Run 'flutter gen-l10n' in hanguk_app and"
            echo "commit the result. Diff:"
            git --no-pager diff --stat -- lib/l10n
            git --no-pager diff -- lib/l10n | head -200
            exit 1
          fi
          echo "lib/l10n is in sync with the ARB files."

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # `manual` is the repo's own tag for tests that are not meant to run in
      # an ordinary pass: test/vapi_test.dart and test/vapi_connection_test.dart
      # both open a real WebRTC call against the live Vapi API. On a runner
      # with no audio device they cannot pass, and every attempt spends real
      # credits. Excluded here rather than deleted — they are useful when
      # someone is deliberately debugging the voice pipeline.
      #
      # Not put in a dart_test.yaml on purpose: that would also change what
      # `flutter test` does on a developer's machine, which is their call and
      # not a side effect of adding CI.
      - name: Test
        # github: each failure is also an annotation on the check, readable
        # without the log; the full expanded report goes to a file.
        run: flutter test --exclude-tags manual --reporter github --file-reporter expanded:build/test_report.txt

      # Screens the pixel tests rendered (test/helpers/screen_pixels.dart):
      # the Study Plan as a phone shows it, keyboard open and closed. Kept
      # even when a test fails — that is when they are most worth a look.
      - name: Keep test screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screens
          path: hanguk_app/build/test_screens/
          if-no-files-found: ignore
          retention-days: 14

      # The same screens and the test report on a release asset
      # (test-screens/pr-<number>.zip), for whoever cannot reach artifact
      # storage. Replaced on every run of the PR.
      - name: Publish test screens
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/test_screens
          [ -f build/test_report.txt ] && cp build/test_report.txt build/test_screens/ || true
          [ -n "$(ls -A build/test_screens)" ] || exit 0
          zip -qr "pr-${{ github.event.number }}.zip" build/test_screens
          gh release view test-screens --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create test-screens --repo "${{ github.repository }}" --prerelease \
              --title "Test screens (CI)" --notes "Screens the pixel tests rendered and the test report, one zip per PR. Written by flutter-check.yml."
          gh release upload test-screens "pr-${{ github.event.number }}.zip" --repo "${{ github.repository }}" --clobber
