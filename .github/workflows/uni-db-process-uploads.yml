name: uni-db process uploads

# Extraction engine for the manual-upload model. Drains staff-uploaded guideline
# PDFs (guideline_documents.parse_status='pending') through extract -> publish ->
# translate. It has NO scraping/discovery — it only reads PDFs already in Supabase
# Storage, so it never touches university websites. Replaces the scraping half of
# uni-db-sync.yml.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   UNI_DB_SUPABASE_DB_URL, UNI_DB_SUPABASE_URL,
#   UNI_DB_SUPABASE_SERVICE_ROLE_KEY, UNI_DB_ANTHROPIC_API_KEY
#   (optional: UNI_DB_DEEPL_API_KEY for the translate stage)
# Scheduled runs fire only from the DEFAULT branch — this activates once merged.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min — drain new uploads promptly
  workflow_dispatch:
    inputs:
      limit:
        description: "Max pending PDFs to extract this run"
        default: "50"
        required: false

# Never overlap two cycles; let the running one finish.
concurrency:
  group: uni-db-process-uploads
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: hanguk_app/services/uni_db
    env:
      # Paid Claude extraction + translate. No crawl flag — we never scrape here.
      UNI_DB_LIVE_APIS: "true"
      UNI_DB_ENV: "production"
      SUPABASE_DB_URL: ${{ secrets.UNI_DB_SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.UNI_DB_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UNI_DB_SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.UNI_DB_ANTHROPIC_API_KEY }}
      DEEPL_API_KEY: ${{ secrets.UNI_DB_DEEPL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hanguk_app/services/uni_db/pyproject.toml

      - name: Install service (base deps — no torch/Playwright)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check required secrets are set
        run: |
          if [ -z "${SUPABASE_DB_URL}" ] || [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Missing secrets. Add UNI_DB_SUPABASE_DB_URL and UNI_DB_ANTHROPIC_API_KEY in Settings → Secrets and variables → Actions (see docs/runbooks/uni-db-go-live.md)."
            exit 1
          fi

      # 1) Extract staff-uploaded PDFs still pending. --pending-only targets only
      #    never-parsed docs and flips a broken PDF to 'failed' so it isn't
      #    re-billed. A systemic failure (DB down / no key) fails the run; a single
      #    bad PDF does not.
      - name: Extract pending uploads
        run: uni-db reparse --pending-only --limit "${{ github.event.inputs.limit || '50' }}"

      # 2) Publish approved items into the public tables the app reads. DB-only + idempotent.
      - name: Publish approved items
        continue-on-error: true
        run: uni-db publish --limit 1000

      # 3) Fill EN/UZ translations for the published content. Best-effort.
      - name: Translate
        continue-on-error: true
        run: python scripts/run_translate_once.py --limit 100
