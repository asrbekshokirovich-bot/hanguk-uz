name: Android APK

# Builds an installable Android APK for the Flutter app so it can be
# side-loaded onto a phone without a local toolchain. Runs on demand
# (workflow_dispatch) and on every push to main that touches the app.
# The APK is published as a build artifact; download it from the run's
# "Artifacts" section, copy it to your phone, and install it (you may
# need to allow "Install from unknown sources").

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hanguk_app/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hanguk_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hanguk-app-release-apk
          path: hanguk_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
