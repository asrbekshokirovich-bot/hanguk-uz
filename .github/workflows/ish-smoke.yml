name: Hanguk Ish — emulyatorda ishga tushirish

# Release APK'lar haqiqiy Android'da ochiladimi: emulyatorda (API 34) ikkala
# ilova o'rnatiladi, ishga tushadi, birinchi ekranni chizadi va bosishga
# javob beradi (A01 → T1, BA0), hech narsa yiqilmaydi. Release'da R8 va
# plaginlar (shared_preferences, Supabase, share_plus) debug testlardan
# farq qiladi. Keyin demo ilovalarda odamdek uzun yurish (P33): ro'yxatdan
# o'tish, A02, smena olish, ish kuni, baho, til saqlanishi; BA1, BA3 QR va
# BA5 CSV ulashish oynasiga.
# Ekran rasmlari va logcat: hanguk-ish-ci prerelease'da
# <branch>-<emulyator>-smoke.zip.

on:
  push:
    branches:
      - 'ish/**'
    paths:
      - 'hanguk_ish/**'
      - '.github/workflows/ish-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ish-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  smoke:
    name: Release builds on an Android emulator (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # The emulator goes away right after a tap that opens T1, with no trace
    # in the logs (no OOM, no crash report; API 34 every time, API 30 once
    # in three). API 30 cannot run the arm64 builds (SIGILL in the ARM
    # translation). Three ways of drawing on API 34 side by side, each with
    # the emulator's own output kept (build/smoke/emulator-output.txt).
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api34-swiftshader
            api: 34
            gpu: -gpu swiftshader_indirect -feature -Vulkan
          - name: api34-swangle
            api: 34
            gpu: -gpu swangle_indirect
          - name: api34-guest
            api: 34
            gpu: -gpu guest
    defaults:
      run:
        working-directory: hanguk_ish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            hanguk_ish/android/*.gradle*
            hanguk_ish/android/app/*.gradle*
            hanguk_ish/android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      # demo: as sent today (arm64 for phones, x86_64 for the emulator);
      # backend: a database address that answers nothing.
      - name: Release APKs
        run: |
          set -eu
          mkdir -p build/smoke-apks
          out=build/app/outputs/flutter-apk
          for app in worker employer; do
            flutter build apk --release --flavor "$app" -t "lib/main_$app.dart" \
              --target-platform android-arm64,android-x64 --split-per-abi
            cp "$out/app-x86_64-$app-release.apk" "build/smoke-apks/demo-$app-x86_64.apk"
            cp "$out/app-arm64-v8a-$app-release.apk" "build/smoke-apks/demo-$app-arm64.apk"
            flutter build apk --release --flavor "$app" -t "lib/main_$app.dart" \
              --target-platform android-x64 --split-per-abi \
              --dart-define=SUPABASE_URL=https://smoke.invalid \
              --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_smoke
            cp "$out/app-x86_64-$app-release.apk" "build/smoke-apks/backend-$app-x86_64.apk"
          done
          ls -la build/smoke-apks

      # The Gradle and Kotlin daemons of the builds above hold gigabytes; with
      # them around the emulator was killed mid-run («device not found»).
      - name: Free memory for the emulator
        run: |
          (cd android && ./gradlew --stop) || true
          pkill -f 'KotlinCompileDaemon|GradleDaemon' || true
          free -m

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A booted, settled emulator from the cache: a cold first boot (Google
      # services setting up, the launcher's first start) froze the apps
      # («isn't responding») and once lost the emulator. The snapshot is made
      # once, after the system has settled, and only read afterwards.
      - name: Emulator snapshot from the cache
        uses: actions/cache/restore@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.name }}-x86_64-google_apis-pixel_6-v3

      - name: Make the emulator snapshot (first run only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window ${{ matrix.gpu }} -noaudio -no-boot-anim -camera-back none
          working-directory: hanguk_ish
          # The emulator's own output to a file (the action reads it only
          # while it boots): when it goes away, its last words are kept.
          pre-emulator-launch-script: bash tool/emulator_wrap.sh
          # Let first-boot work finish before the state is saved.
          script: |
            timeout 300 adb shell am wait-for-broadcast-idle || true
            sleep 180
            timeout 300 adb shell am wait-for-broadcast-idle || true

      # Saved now, whatever the walks below do.
      - name: Keep the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.name }}-x86_64-google_apis-pixel_6-v3

      - name: Start the apps on an emulator
        # The walks take about 15 minutes; a hung emulator stops here.
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          # A common phone screen (1080×2400): the walks need fewer swipes.
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          # -show-kernel: a guest kernel panic or low-memory kill shows here.
          emulator-options: -no-snapshot-save -no-window ${{ matrix.gpu }} -noaudio -no-boot-anim -camera-back none -show-kernel -verbose
          working-directory: hanguk_ish
          # The emulator's own output to a file (the action reads it only
          # while it boots): when it goes away, its last words are kept.
          pre-emulator-launch-script: bash tool/emulator_wrap.sh
          script: bash tool/smoke.sh build/smoke-apks

      # Why an emulator went away: the host kernel's last lines (an OOM
      # kill), the emulator's crash reports, whether it still runs.
      - name: Host memory, kernel and emulator crash reports
        if: failure()
        run: |
          free -m
          sudo dmesg | tail -n 40 || true
          pgrep -a -f 'qemu-system|emulator' || echo 'no emulator process'
          if [ -d /tmp/android-runner ]; then
            find /tmp/android-runner -type f -printf '%TT %s %p\n' | sort | tail -n 20
            mkdir -p build/smoke/emulator-crash
            cp -r /tmp/android-runner/emu-crash-* build/smoke/emulator-crash/ 2>/dev/null || true
            cp -r /tmp/android-runner/netsimd build/smoke/emulator-netsimd 2>/dev/null || true
          fi
          tail -n 60 build/smoke/emulator-output.txt 2>/dev/null || true
          cp ~/.android/avd/test.avd/config.ini build/smoke/emulator-config.ini 2>/dev/null || true

      - name: Publish the screens and logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          [ -d build/smoke ] && [ -n "$(ls -A build/smoke)" ] || exit 0
          ASSET_PREFIX="${GITHUB_REF_NAME//\//-}-${{ matrix.name }}"
          (cd build/smoke && zip -qr "../../${ASSET_PREFIX}-smoke.zip" .)
          for i in 1 2 3; do
            gh release upload hanguk-ish-ci "${ASSET_PREFIX}-smoke.zip" --clobber && break
            sleep 5
          done
