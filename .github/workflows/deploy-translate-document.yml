name: Deploy translate-document function

# Deploys the translate-document edge function (which bundles the PT diploma
# template) to the live Supabase project. Run manually from the Actions tab.
#
# One-time setup: add a repository secret SUPABASE_ACCESS_TOKEN
#   (Supabase dashboard → Account → Access Tokens → generate).

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy translate-document \
            --project-ref lysjdtyanhdfphqyijsr \
            --no-verify-jwt
