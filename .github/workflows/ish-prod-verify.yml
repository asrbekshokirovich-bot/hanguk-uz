# One-off, read-only check of what the P60 migrations did in production.
# Runs on push of this file only; deleted right after.
name: Hanguk Ish — production tekshiruvi (o'qish)

on:
  push:
    branches: ['claude/funny-einstein-epf1oz']
    paths: ['.github/workflows/ish-prod-verify.yml']

permissions:
  contents: read

env:
  SUPABASE_PROJECT_ID: lysjdtyanhdfphqyijsr

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only queries
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -u
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query"
          q() {
            echo "### $1"
            jq -n --arg query "$2" '{query: $query}' > body.json
            curl -sS -w '\nHTTP %{http_code}\n' -X POST "$api" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @body.json | head -c 3000
            echo
          }
          # Everything below is rolled back: the block always ends in an error.
          q trigger_test "do \$\$ declare w uuid := gen_random_uuid(); o uuid := gen_random_uuid(); b uuid; s uuid; a uuid; n int; begin insert into auth.users (id, aud, role, email, raw_user_meta_data, created_at, updated_at, instance_id) values (w, 'authenticated', 'authenticated', 'w-' || w || '@verify.invalid', '{\"app\":\"hanguk_ish\"}'::jsonb, now(), now(), '00000000-0000-0000-0000-000000000000'), (o, 'authenticated', 'authenticated', 'o-' || o || '@verify.invalid', '{\"app\":\"hanguk_ish\"}'::jsonb, now(), now(), '00000000-0000-0000-0000-000000000000'); insert into ish.businesses (owner_id, name, biz_no, status) values (o, 'verify', '9999999999', 'verified') returning id into b; insert into ish.shifts (business_id, title, starts_at, ends_at, hourly_wage, slots, created_by) values (b, 'verify', now() + interval '1 day', now() + interval '1 day 4 hours', 20000, 1, o) returning id into s; insert into ish.applications (shift_id, worker_id, status) values (s, w, 'confirmed') returning id into a; update ish.applications set status = 'completed' where id = a; select count(*) into n from ish.notifications where user_id = w and kind = 'shift_finished'; raise exception 'TRIGGER_TEST notices_created=% (rolled back)', n; end \$\$"
          q after_rollback "select count(*) as finished_notices from ish.notifications where kind='shift_finished'"
          echo "### REST (anon, schema ish): the table must be visible to the API"
          curl -sS -w '\nHTTP %{http_code}\n' "https://lysjdtyanhdfphqyijsr.supabase.co/rest/v1/monthly_jobs?select=id&limit=1" \
            -H "apikey: sb_publishable_Ne64VlXnQ7tWJJ1e7aQLGg_5OgQiof3" -H "Accept-Profile: ish" | head -c 600
