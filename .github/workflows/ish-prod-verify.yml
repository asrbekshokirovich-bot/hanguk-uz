# One-off, read-only check of what the P60 migrations did in production.
# Runs on push of this file only; deleted right after.
name: Hanguk Ish — production tekshiruvi (o'qish)

on:
  push:
    branches: ['claude/funny-einstein-epf1oz']
    paths: ['.github/workflows/ish-prod-verify.yml']

permissions:
  contents: read

env:
  SUPABASE_PROJECT_ID: lysjdtyanhdfphqyijsr

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only queries
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -u
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query"
          q() {
            echo "### $1"
            jq -n --arg query "$2" '{query: $query}' > body.json
            curl -sS -w '\nHTTP %{http_code}\n' -X POST "$api" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @body.json | head -c 3000
            echo
          }
          q tables "select c.relname, c.relrowsecurity from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='ish' and c.relname like 'monthly%' order by 1"
          q policies "select tablename, policyname, cmd from pg_policies where schemaname='ish' and tablename like 'monthly%' order by 1,2"
          q grants "select table_name, grantee, string_agg(privilege_type, ',' order by privilege_type) from information_schema.role_table_grants where table_schema='ish' and table_name like 'monthly%' and grantee in ('anon','authenticated') group by 1,2 order by 1,2"
          q trigger "select tgname, tgenabled from pg_trigger where tgname='applications_notify_finished' and not tgisinternal"
          q constraint "select pg_get_constraintdef(oid) like '%shift_finished%' as has_kind from pg_constraint where conname='notifications_kind_check' and conrelid='ish.notifications'::regclass"
          q push_app "select ish.push_app('shift_finished', '{}'::jsonb) as app"
          q counts "select (select count(*) from ish.monthly_jobs) as jobs, (select count(*) from ish.monthly_applications) as applications, (select count(*) from ish.notifications where kind='shift_finished') as finished_notices"
          echo "### REST (anon, schema ish): the table must be visible to the API"
          curl -sS -w '\nHTTP %{http_code}\n' "https://lysjdtyanhdfphqyijsr.supabase.co/rest/v1/monthly_jobs?select=id&limit=1" \
            -H "apikey: sb_publishable_Ne64VlXnQ7tWJJ1e7aQLGg_5OgQiof3" -H "Accept-Profile: ish" | head -c 600
