name: Build test APK

# An installable APK of the student app, published at a stable URL.
#
# `android-release.yml` builds the Play-ready bundle, but it requires the
# upload-key secrets and fails loudly without them — by design, since a
# debug-signed artifact must never reach Play. That makes it the wrong tool for
# "let me see the change on my phone", which is the loop this workflow closes:
# no secrets, debug signing (build.gradle.kts falls back when key.properties is
# absent), installable by sideload, NOT a Play artifact.
#
# The APK is attached to a rolling GitHub Release rather than an Actions
# artifact. Release assets download from one unchanging URL with no login and
# no zip to unpack, and reusing a single tag replaces the previous asset each
# run so storage never accumulates:
#
#   https://github.com/asrbekshokirovich-bot/hanguk-uz/releases/download/app-apk-latest/app-release.apk
#
# Because it is debug-signed, it will not install over a Play-signed copy —
# uninstall that first.

on:
  # Actions daqiqalari (2026-11-05): repo private bo'ldi — oyiga 2 000 daqiqa, macOS x10.
  # Har push'da APK (~8 daqiqa) o'rniga faqat qo'lda: Actions → Run workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag for this APK (one per PR keeps them apart). Blank = app-apk-latest."
        required: false
        default: ""

concurrency:
  group: build-test-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build student app APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Needed to publish the APK as a Release asset.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: hanguk_app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get
      # The catalogue reads the app shows on a first launch while the network
      # loads (hanguk_app/lib/core/cache/cached_rows.dart). A failed read
      # keeps the committed placeholder; the build goes on.
      - name: Snapshot catalogue data
        continue-on-error: true
        run: dart run tools/fetch_data_snapshots.dart

      # Fails the build on a real analyzer error before spending eight minutes
      # compiling something that cannot work.
      #
      # `--no-fatal-infos` because the tree carries 14 pre-existing lint infos
      # (deprecated `dart:js`, `avoid_print` in a web helper, naming nits) and
      # bare `flutter analyze` exits 1 on any issue at all. Without it this
      # gate blocked every APK over style suggestions that have nothing to do
      # with whether the build works. Warnings and errors are still fatal,
      # which is the whole point of the step.
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos lib test

      # arm64 only (every phone the app is used on; half the size), and the
      # crash reporter switched on when the SENTRY_DSN secret is set — without
      # it the SDK no-ops, as before (plan P07 / U6.1).
      - name: Build release APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          defines=""
          [ -n "$SENTRY_DSN" ] && defines="--dart-define=SENTRY_DSN=$SENTRY_DSN"
          echo "SENTRY_DSN supplied: $([ -n "$SENTRY_DSN" ] && echo yes || echo 'no (crash reporting no-ops)')"
          flutter build apk --release --target-platform android-arm64 $defines

      - name: Publish APK to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          TAG="${TAG:-app-apk-latest}"
          # Drop the previous rolling release and tag so only the newest asset
          # is kept and the download URL stays the same.
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "Latest test APK" \
            --notes "Debug-signed test build from ${GITHUB_SHA} on ${GITHUB_REF_NAME}. Sideload only — not a Play artifact. Uninstall any Play-signed copy first." \
            --prerelease \
            --target "$GITHUB_SHA"

      # Secondary copy for anyone already on the run page. continue-on-error so
      # a full artifact-storage quota cannot fail the build — the Release above
      # is the reliable path.
      - name: Upload APK artifact (best-effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hanguk-student-app-apk
          path: hanguk_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 5
