name: Hanguk Ish — create the iOS project (one-off)

# Runs `flutter create --platforms=ios` for hanguk_ish and uploads ios/ as an
# artifact, to be committed by hand. Temporary: removed once ios/ is in the repo.
on:
  push:
    branches: [feat/ish-ios]
    paths: ['.github/workflows/ish-ios-create.yml']

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hanguk_ish
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ish-ios
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter create --platforms=ios --org uz.hanguk --project-name hanguk_ish --no-pub .
      - run: find ios -type f | sort
      # Commit ios/ back to this branch (the artifact store is not reachable
      # from where the rest of the work is done).
      - name: Commit ios/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          git commit -m "Hanguk Ish: iOS project from flutter create (stable)" || echo "nothing new"
          git push origin HEAD:feat/ish-ios
