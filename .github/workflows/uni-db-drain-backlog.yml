name: uni-db drain extraction backlog

# Re-run FAILED extractions until the guest screens are full.
#
# 57 institutions are approved and visible in the app, but only a handful carry
# the four things a student actually chooses on — tuition, the application
# window, the TOPIK floor, the language requirement. The data is not missing
# from the source: every one of the 57 has its 모집요강 stored, and extraction
# succeeded for all of them at least once. What is missing is the ~490 field
# extractions that died on CLI timeouts, a 401 during one session, or a schema
# rejection. `retry-failed` re-reads the STORED PDF (no crawling, hash verified)
# and re-runs only the groups whose latest job failed.
#
# Why a workflow and not a person running it: draining the backlog is many
# hours of model calls. That cannot live in an interactive session — an
# ephemeral container restarts and takes the run with it, which is exactly how
# the first attempt was lost. Here it runs on GitHub, resumes on the next tick,
# and needs nobody watching.
#
# It converges on its own: every run takes the next slice of whatever is still
# failing, and when nothing is left `jobs_seen=0` and the run is a no-op. Safe
# to leave scheduled forever — it costs nothing once the backlog is empty.
#
# Ordering is deliberate. `scholarships` is skipped by default: no screen in
# the app renders it, and it is ~104 of the ~490 jobs. Drain it later by
# dispatching with skip_groups empty.
#
# Required repo secrets (same ones uni-db-auto-crawl.yml already uses):
#   UNI_DB_SUPABASE_DB_URL, UNI_DB_SUPABASE_URL,
#   UNI_DB_SUPABASE_SERVICE_ROLE_KEY, UNI_DB_ANTHROPIC_API_KEY
#
# Two ways to pay for the model calls. The default is the API key, billed per
# token. Dispatching with `llm_backend: claude_cli` runs the same work through
# the `claude` CLI on a Claude subscription instead — no API key, no per-token
# bill — which is what unblocks a drain when the API balance is empty. It needs
# UNI_DB_CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) and is slower: the CLI
# backend serializes its calls to one at a time, and the reliability gauntlet
# drops from `maximum` to `balanced`. Cards still go through staff approval
# either way, so the floor on what reaches a student does not move.

on:
  schedule:
    # Every 3 hours. Each run works for up to ~2.5h, so the ticks chain into
    # near-continuous progress without ever overlapping (see `concurrency`).
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max failed extraction jobs to pick up this run"
        default: "120"
        required: false
      skip_groups:
        description: "Field groups to leave in the backlog (comma-separated). Empty = drain everything."
        default: "scholarships"
        required: false
      reparse_mode:
        description: "Which documents the re-verify step takes: 'backlog' (least-parsed first) or 'open-cards' (what the reviewer is looking at)"
        default: "backlog"
        required: false
      reparse_limit:
        description: "Max documents for the re-verify step"
        default: "8"
        required: false
      llm_backend:
        description: "'claude_cli' (Claude subscription, no per-token bill) or 'anthropic' (API key, billed per token)"
        default: "claude_cli"
        required: false

# Never two drains at once — they would fight over the same failed jobs, and
# the LLM budget. A running one always wins; the next tick picks up after.
concurrency:
  group: uni-db-drain-backlog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    name: Re-extract failed field groups
    runs-on: ubuntu-latest
    # Under GitHub's 6h job ceiling with room to spare; the step below stops
    # itself before this fires so the run always ends cleanly.
    timeout-minutes: 170
    defaults:
      run:
        working-directory: hanguk_app/services/uni_db
    env:
      # Calls the paid LLM. Does NOT crawl — every PDF is read from storage.
      UNI_DB_LIVE_APIS: "true"
      UNI_DB_LIVE_CRAWL: "false"
      UNI_DB_ENV: "production"
      # Pinned, not left to the config default. `maximum` is what makes a card
      # worth trusting: each field group is re-extracted independently and the
      # critical figures must agree, an LLM judge hunts every quote in the
      # source, and three adversarial critics try to break the result.
      #
      # On `claude_cli` this value is not what runs: `effective_verify_level`
      # caps the subscription backend at `balanced` (deterministic grounding
      # and sanity, no judges, no consensus) because the heavy levels fan out
      # ~35 nested `claude` calls per document and trip usage limits. Pinning
      # `maximum` here is still right — it is what the API backend uses, and
      # the cap is applied by the code that knows the backend rather than by
      # whoever dispatched the run.
      UNI_DB_VERIFY_LEVEL: "maximum"
      # Five independent extractions rather than three: with three, one bad
      # run makes 2-1 and the majority still looks like a majority. Five turns
      # the same single outlier into 4-1 and leaves room for a second.
      UNI_DB_CONSENSUS_RUNS: "5"
      SUPABASE_DB_URL: ${{ secrets.UNI_DB_SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.UNI_DB_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UNI_DB_SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.UNI_DB_ANTHROPIC_API_KEY }}
      CLOUDCONVERT_API_KEY: ${{ secrets.UNI_DB_CLOUDCONVERT_API_KEY }}
      # Which backend does the extracting. Scheduled ticks send no inputs, so
      # they keep running on the API key exactly as before; `claude_cli` is
      # something a human chooses when dispatching, most usefully when the API
      # balance is empty and the work should not wait for a top-up.
      UNI_DB_LLM_BACKEND: ${{ github.event.inputs.llm_backend || 'claude_cli' }}
      # Read by the `claude` CLI itself, not by our code — the CLI backend
      # shells out and the subprocess inherits this. Minted with
      # `claude setup-token` (a subscription token, NOT an API key).
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.UNI_DB_CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hanguk_app/services/uni_db/pyproject.toml

      - name: Install service (base deps — no torch/Playwright)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Only on the subscription backend, and only then: the API path must not
      # pay a minute of npm install for a binary it never runs.
      - name: Install the Claude CLI (subscription backend only)
        if: env.UNI_DB_LLM_BACKEND == 'claude_cli'
        run: npm install -g @anthropic-ai/claude-code

      # The two backends need DIFFERENT credentials, so checking for the API
      # key unconditionally would fail a keyless run that is correctly
      # configured — and, worse, would pass a `claude_cli` run whose token is
      # missing, which then dies one document at a time.
      - name: Check required secrets are set
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::Missing secret UNI_DB_SUPABASE_DB_URL (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ "${UNI_DB_LLM_BACKEND}" = "claude_cli" ]; then
            if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
              echo "::error::Backend 'claude_cli' needs UNI_DB_CLAUDE_CODE_OAUTH_TOKEN. Mint it with 'claude setup-token' and add it in Settings → Secrets and variables → Actions."
              exit 1
            fi
            echo "::notice::Backend claude_cli — running on the Claude subscription, no per-token bill. Verify level is capped at 'balanced'."
          else
            if [ -z "${ANTHROPIC_API_KEY}" ]; then
              echo "::error::Missing secret UNI_DB_ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions)."
              exit 1
            fi
          fi

      # Loop rather than one big --limit: each pass commits its results, so a
      # timeout or a runner eviction costs the pass in flight, not the run.
      #
      # Three exits, and the third one is the reason this comment is long.
      # The loop originally stopped only on an empty backlog or the deadline,
      # so when the API key was rejected on 2026-08-12 it kept calling for
      # eighteen hours across six scheduled runs. Every call returned 401,
      # every 401 was recorded as a failed extraction job, and every failed
      # job became a candidate for the next pass: the failed-jobs table went
      # from ~500 to ~75,000 and the review queue emptied. A loop whose only
      # stop conditions are "done" and "out of time" turns a broken
      # credential into a self-feeding backlog. `retry-failed` now exits 3 on
      # a fatal credential error and the run stops on it.
      - name: Re-extract failed jobs
        env:
          LIMIT: ${{ github.event.inputs.limit || '120' }}
          SKIP_GROUPS: ${{ github.event.inputs.skip_groups || 'scholarships' }}
          # Leave room under the job timeout for the re-verify and publish
          # steps below.
          DEADLINE_MIN: "80"
        run: |
          set -uo pipefail
          started=$(date +%s)
          pass=0
          while :; do
            pass=$((pass + 1))
            elapsed=$(( ($(date +%s) - started) / 60 ))
            if [ "$elapsed" -ge "$DEADLINE_MIN" ]; then
              echo "::notice::Stopping after ${elapsed}m — next scheduled run continues."
              break
            fi
            echo "--- pass ${pass} (${elapsed}m elapsed) ---"
            # `set -o pipefail` above makes this assignment carry uni-db's
            # exit status through `tee`/`tail`, so `rc` is the command's own.
            out=$(uni-db retry-failed --limit "$LIMIT" --skip-groups "$SKIP_GROUPS" 2>&1 | tee /dev/stderr | tail -2 | tr '\n' ' ')
            rc=$?
            if [ "$rc" -eq 3 ]; then
              if [ "${UNI_DB_LLM_BACKEND}" = "claude_cli" ]; then
                bad_secret="UNI_DB_CLAUDE_CODE_OAUTH_TOKEN (re-mint with 'claude setup-token')"
              else
                bad_secret="UNI_DB_ANTHROPIC_API_KEY"
              fi
              echo "::error::Extraction credential rejected or out of balance — every LLM call is failing and each failure enlarges the backlog. Fix ${bad_secret} in Settings → Secrets and variables → Actions, then re-run. Stopped after ${pass} pass(es)."
              exit 1
            fi
            case "$out" in
              *"jobs_seen=0 "*)
                echo "::notice::Backlog empty for skip_groups='${SKIP_GROUPS}'. Nothing left to re-extract."
                break
                ;;
            esac
          done

      # Phase 2 — re-verify what SUCCEEDED under the weaker gauntlet.
      #
      # Draining failed jobs only reaches documents that errored. Everything
      # that succeeded on the subscription backend was capped at `balanced`:
      # deterministic checks only, no consensus, no judge, no critics. Those
      # cards are already in the queue looking no different from cross-checked
      # ones, and re-running them here is what puts every university through
      # the same gauntlet.
      #
      # Least-recently-parsed first (the worker's own order), so each run takes
      # the next slice and the catalogue comes round over successive ticks.
      # continue-on-error and a small limit: this is the lower-priority half,
      # and it must never cost the run its publish step.
      # `reparse_mode: open-cards` re-does exactly what the reviewer has on
      # screen; the default drains the least-parsed backlog instead. Two
      # genuinely different jobs — a document whose card is open may have been
      # parsed several times and sorts LAST under the backlog order.
      - name: Re-verify already-parsed documents
        continue-on-error: true
        timeout-minutes: 60
        env:
          REPARSE_MODE: ${{ github.event.inputs.reparse_mode || 'backlog' }}
          REPARSE_LIMIT: ${{ github.event.inputs.reparse_limit || '8' }}
        run: |
          if [ "$REPARSE_MODE" = "open-cards" ]; then
            uni-db reparse --limit "$REPARSE_LIMIT" --open-cards
          else
            uni-db reparse --limit "$REPARSE_LIMIT"
          fi

      # Move anything a reviewer has approved into the tables the app reads.
      # DB-only and idempotent, so it is safe on every run and keeps the app in
      # step with the review queue without a separate trigger.
      - name: Publish approved items
        continue-on-error: true
        run: uni-db publish --limit 1000

      - name: Report what is still missing
        continue-on-error: true
        run: uni-db todo || true

      # Diagnose the non-PDF blobs LAST, so a log tail always reaches it.
      # A green run with twelve unchanged documents told us nothing; this line
      # per document says what each blob really is and whether the remote
      # tier is even configured.
      - name: What the unreadable blobs actually are
        continue-on-error: true
        run: uni-db convert-check --limit 20 || true

