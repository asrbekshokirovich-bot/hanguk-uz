name: Hanguk Ish — tekshiruv, ekranlar, APK

# «Hanguk Ish» (hanguk_ish/): kunlik smena ilovasi — bitta kod, ikki ilova
# (ishchi uz.hanguk.ish va ish beruvchi uz.hanguk.ish.biz).
#
# check: flutter analyze + unit/widget testlar + ekran rasmlari (haqiqiy
#        shriftlar bilan, prototip bilan solishtirish uchun).
# timezones: o'sha testlar telefon boshqa vaqt zonasida bo'lganda
#        (Toshkent, Los-Anjeles) — kun va soat baribir Koreya bo'yicha.
# apk:   ikkala flavor'ning release APK'si (arm64, sideload test kaliti);
#        secrets'da Supabase manzili bo'lsa — o'sha bazaga ulanadi, bo'lmasa
#        demo; yuklash kaliti bo'lsa — Play uchun imzolangan .aab ham.
#
# Natijalar bitta prerelease'da (hanguk-ish-ci), har branch uchun alohida nom:
#   <branch>-screens.zip, <branch>-worker-arm64.apk, <branch>-employer-arm64.apk
#   (branch nomidagi «/» → «-», masalan ish-p0-poydevor-screens.zip)
# Repo public — Actions daqiqalari bepul, shuning uchun har push'da ishlaydi.
# Trigger — ish/* branch'ga push (PR sahifasida ham shu natija ko'rinadi).

on:
  push:
    branches:
      - 'ish/**'
    paths:
      - 'hanguk_ish/**'
      - '.github/workflows/ish-check.yml'
  workflow_dispatch:

concurrency:
  group: ish-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: hanguk-ish-ci

jobs:
  check:
    name: Analyze, test, render screens
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hanguk_ish
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          # Pinned: a newer Flutter may drop the Android Gradle Plugin,
          # Gradle and Kotlin versions this project uses (3.47 already warns).
          # Raise it here and in the other ish-* workflows together.
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Toolchain
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Localizations
        run: flutter gen-l10n

      # Warnings and errors fail the job; lint infos are listed but do not.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Runs even when Analyze failed, so one lint does not hide test results.
      - name: Unit and widget tests
        if: success() || failure()
        run: |
          mkdir -p build
          flutter test --exclude-tags screens --coverage --reporter github --file-reporter expanded:build/test_report.txt

      # Which lines of lib/ the tests above run, and the least covered files
      # (the job summary; coverage/lcov.info goes with the screens).
      - name: Coverage
        if: success() || failure()
        run: |
          [ -f coverage/lcov.info ] || exit 0
          python3 tool/coverage_summary.py coverage/lcov.info "Unit and widget tests: coverage of lib/" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p build/screens && cp coverage/lcov.info build/screens/lcov-unit.info

      # Full screens with the real fonts, written as PNGs for review against
      # the prototype. Runs even when the tests above failed.
      - name: Render screens
        if: always()
        run: flutter test --tags screens --update-goldens --reporter github

      - name: Publish screens
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          ASSET_PREFIX="${GITHUB_REF_NAME//\//-}"
          mkdir -p build/screens
          cp -r test/screens/goldens/. build/screens/ 2>/dev/null || true
          [ -d build/screens2x ] && cp -r build/screens2x build/screens/2x || true
          [ -d build/layout ] && cp -r build/layout build/screens/layout || true
          [ -f build/test_report.txt ] && cp build/test_report.txt build/screens/ || true
          [ -n "$(ls -A build/screens)" ] || exit 0
          (cd build/screens && zip -qr "../../${ASSET_PREFIX}-screens.zip" .)
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --prerelease --title "Hanguk Ish CI" \
              --notes "ish-check.yml natijalari: ekran rasmlari va test APK'lar (sideload, Play uchun emas)." || true
          for i in 1 2 3; do
            gh release upload "$RELEASE_TAG" "${ASSET_PREFIX}-screens.zip" --clobber && break
            sleep 5
          done

      - name: Keep screens as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanguk-ish-screens
          path: hanguk_ish/build/screens/
          if-no-files-found: ignore
          retention-days: 14

  # The shifts are in Korea, the phones not always: one still on Tashkent
  # time (UTC+5), or one far to the west, must show the same Korean days and
  # hours. The unit and widget tests again, in those zones.
  timezones:
    name: Tests in other time zones
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        tz: [Asia/Tashkent, America/Los_Angeles]
    defaults:
      run:
        working-directory: hanguk_ish
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          # Pinned: a newer Flutter may drop the Android Gradle Plugin,
          # Gradle and Kotlin versions this project uses (3.47 already warns).
          # Raise it here and in the other ish-* workflows together.
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Localizations
        run: flutter gen-l10n

      - name: Unit and widget tests in ${{ matrix.tz }}
        env:
          TZ: ${{ matrix.tz }}
        run: |
          date
          flutter test --exclude-tags screens --reporter github

  apk:
    name: Build APKs (worker + employer, arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: hanguk_ish
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            hanguk_ish/android/*.gradle*
            hanguk_ish/android/app/*.gradle*
            hanguk_ish/android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          # Pinned: a newer Flutter may drop the Android Gradle Plugin,
          # Gradle and Kotlin versions this project uses (3.47 already warns).
          # Raise it here and in the other ish-* workflows together.
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      # With the repository secrets ISH_SUPABASE_URL and
      # ISH_SUPABASE_PUBLISHABLE_KEY the apps use that database; without
      # them, the demo data. (The publishable key ships in every app build;
      # it is kept in secrets only so no project is named in the code.)
      - name: Worker APK
        env:
          SUPABASE_URL: ${{ secrets.ISH_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ISH_SUPABASE_PUBLISHABLE_KEY }}
        run: >-
          flutter build apk --release --flavor worker -t lib/main_worker.dart
          --target-platform android-arm64 --split-per-abi --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Employer APK
        env:
          SUPABASE_URL: ${{ secrets.ISH_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ISH_SUPABASE_PUBLISHABLE_KEY }}
        run: >-
          flutter build apk --release --flavor employer -t lib/main_employer.dart
          --target-platform android-arm64 --split-per-abi --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      # Play: with the upload key in the repository secrets (ISH_UPLOAD_KEYSTORE
      # as base64, ISH_UPLOAD_KEYSTORE_PASSWORD, ISH_UPLOAD_KEY_ALIAS,
      # ISH_UPLOAD_KEY_PASSWORD) the two app bundles are built and signed for
      # upload. The APKs above stay on the sideload test key.
      - name: Play bundles (when the upload key is set)
        env:
          UPLOAD_KEYSTORE: ${{ secrets.ISH_UPLOAD_KEYSTORE }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ISH_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ISH_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ISH_UPLOAD_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.ISH_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ISH_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -eu
          if [ -z "$UPLOAD_KEYSTORE" ]; then
            echo "No upload key in the secrets: no Play bundles."
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE" | base64 -d > android/upload.keystore
          {
            echo "storeFile=upload.keystore"
            echo "storePassword=$UPLOAD_KEYSTORE_PASSWORD"
            echo "keyAlias=$UPLOAD_KEY_ALIAS"
            echo "keyPassword=$UPLOAD_KEY_PASSWORD"
          } > android/key.properties
          for app in worker employer; do
            flutter build appbundle --release --flavor "$app" -t "lib/main_$app.dart" \
              --build-number=${{ github.run_number }} \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          done
          rm -f android/key.properties android/upload.keystore

      - name: Publish APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ASSET_PREFIX="${GITHUB_REF_NAME//\//-}"
          out=build/app/outputs/flutter-apk
          ls -la "$out"
          # --split-per-abi: only arm64 native libraries (ML Kit ships every ABI).
          cp "$out/app-arm64-v8a-worker-release.apk" "${ASSET_PREFIX}-worker-arm64.apk"
          cp "$out/app-arm64-v8a-employer-release.apk" "${ASSET_PREFIX}-employer-arm64.apk"
          assets=("${ASSET_PREFIX}-worker-arm64.apk" "${ASSET_PREFIX}-employer-arm64.apk")
          bundles=build/app/outputs/bundle
          for app in worker employer; do
            if [ -f "$bundles/${app}Release/app-${app}-release.aab" ]; then
              cp "$bundles/${app}Release/app-${app}-release.aab" "${ASSET_PREFIX}-${app}.aab"
              assets+=("${ASSET_PREFIX}-${app}.aab")
            fi
          done
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --prerelease --title "Hanguk Ish CI" \
              --notes "ish-check.yml natijalari: ekran rasmlari va test APK'lar (sideload, Play uchun emas)." || true
          for i in 1 2 3; do
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber && break
            sleep 5
          done
